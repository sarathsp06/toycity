<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Toy City · Barendrecht</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

  .me-arrow { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 18px solid #e24a3b; filter: drop-shadow(0 0 2px #fff); }
  #hud select { font: inherit; padding: 3px 6px; border: 1px solid #c5d2da; border-radius: 6px; background: #fff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="loading">Building Barendrecht…</div>
<div id="hud">
  <b id="title">Barendrecht · Schaatsbaan</b><br/>
  <span id="stats"></span><br/>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows walk · <kbd>Shift</kbd> bike · drag to look · click anywhere to go there · scroll or <kbd>+</kbd><kbd>−</kbd> zoom<br/>
  <kbd>F</kbd> toggle free fly camera
  <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
    <select id="region" aria-label="Region"></select>
    <select id="tod" aria-label="Time of day"><option value="morning">Morning</option><option value="noon" selected>Midday</option><option value="golden">Golden hour</option><option value="dusk">Dusk</option><option value="night">Night</option></select>
  </div>
  <form id="goto" style="margin-top:6px;display:flex;gap:4px"><input id="q" placeholder="Go to address or place, e.g. Schaatsbaan 43" style="flex:1;padding:5px 8px;border:1px solid #c5d2da;border-radius:6px;font:inherit"/><button style="padding:5px 9px;border:1px solid #c5d2da;border-radius:6px;background:#fff;cursor:pointer">Go</button></form>
</div>
<div id="place">arriving…</div>
<div id="mini"></div><button id="minibtn" title="Bigger or smaller map">⤢</button>
<div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { buildDetail } from './detail.js';

// regions are baked by bake.py into regions/<slug>/; ?region=<slug> picks one
const params = new URLSearchParams(location.search);
const regions = await fetch('./regions/index.json').then(r => r.ok ? r.json() : []).catch(() => []);
const regionSlug = params.get('region') || (regions[0] && regions[0].slug);
const blockUrl = new URL(regionSlug ? `./regions/${regionSlug}/block.json` : './block.json', location.href);
const block = await (await fetch(blockUrl)).json();
if (block.title) { document.getElementById('title').textContent = block.title; document.title = 'Toy City · ' + block.title; }
{
  const sel = document.getElementById('region');
  for (const r of regions) sel.add(new Option(r.title, r.slug, false, r.slug === regionSlug));
  if (!regions.length) sel.style.display = 'none';
  sel.onchange = () => { location.search = '?region=' + sel.value; };
}
const HALF = block.half;

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ccbe8);
scene.fog = new THREE.Fog(0x9ccbe8, 350, 900);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 3000);

const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(-250, 380, 200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
const sc = sun.shadow.camera; sc.left = -HALF; sc.right = HALF; sc.top = HALF; sc.bottom = -HALF; sc.near = 10; sc.far = 1200;
scene.add(sun, sun.target);
const SUN_OFFSET = sun.position.clone(), SUN_CENTRE = new THREE.Vector3();
scene.add(new THREE.HemisphereLight(0xdff0ff, 0x8a9a7a, 1.4));
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
// physical sky, also used as the light environment for the textured detail zone
const sky = new Sky(); sky.scale.setScalar(5000);
{
  const u = sky.material.uniforms; u.turbidity.value = 4; u.rayleigh.value = 1.4; u.mieCoefficient.value = 0.004; u.mieDirectionalG.value = 0.8;
  u.sunPosition.value.copy(sun.position).normalize();
  scene.add(sky);
  const pm = new THREE.PMREMGenerator(renderer); const env = new THREE.Scene(); env.add(sky.clone());
  scene.environment = pm.fromScene(env).texture; scene.environmentIntensity = 0.45;
  scene.background = null;
}
const hemi = scene.children.find(o => o.isHemisphereLight), amb = scene.children.find(o => o.isAmbientLight);

// helpers: block x = east, y = north. three: x east, z = -north.
const P = (p) => new THREE.Vector3(p[0], 0, -p[1]);
function shapeFrom(poly, holes = []) {
  const s = new THREE.Shape(poly.map(p => new THREE.Vector2(p[0], p[1])));
  for (const h of holes) s.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1]))));
  return s;
}
function flat(geo) { geo.rotateX(-Math.PI / 2); return geo; } // shape (x,y) -> (x, 0, -y)

// ---------- ground ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2 + 400, HALF * 2 + 400), new THREE.MeshLambertMaterial({ color: 0xcfd9c2 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05; ground.receiveShadow = true;
scene.add(ground);

// ---------- green ----------
{
  const geos = [];
  for (const g of block.green) {
    try { geos.push(flat(new THREE.ShapeGeometry(shapeFrom(g.p)))); } catch {}
  }
  if (geos.length) {
    const m = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(geos), new THREE.MeshLambertMaterial({ color: 0x8fc46b }));
    m.position.y = 0.02; m.receiveShadow = true; scene.add(m);
  }
}

// ---------- water ----------
{
  const geos = [];
  for (const w of block.water) { try { geos.push(flat(new THREE.ShapeGeometry(shapeFrom(w.p, w.holes)))); } catch {} }
  for (const w of block.waterways) geos.push(ribbon(w.p, w.w));
  if (geos.length) {
    const m = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(geos), new THREE.MeshPhongMaterial({ color: 0x4aa3df, shininess: 90, specular: 0x88c8ff }));
    m.position.y = 0.04; scene.add(m);
  }
}

// ---------- roads ----------
function ribbon(pts, width) {
  const half = width / 2, parts = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = P(pts[i]), b = P(pts[i + 1]);
    const d = b.clone().sub(a); const len = d.length(); if (len < 0.01) continue;
    const g = new THREE.PlaneGeometry(len, width);
    g.rotateX(-Math.PI / 2);
    g.rotateY(-Math.atan2(d.z, d.x));
    g.translate((a.x + b.x) / 2, 0, (a.z + b.z) / 2);
    parts.push(g);
    const c = new THREE.CircleGeometry(half, 10); c.rotateX(-Math.PI / 2); c.translate(b.x, 0, b.z); parts.push(c);
  }
  const c0 = new THREE.CircleGeometry(half, 10); c0.rotateX(-Math.PI / 2); const a0 = P(pts[0]); c0.translate(a0.x, 0, a0.z); parts.push(c0);
  return BufferGeometryUtils.mergeGeometries(parts);
}
{
  const byKind = { path: [], street: [], main: [] };
  for (const r of block.roads) byKind[r.kind].push(ribbon(r.p, r.w));
  const colors = { path: 0xb3a999, street: 0x8d9398, main: 0x6f767c };
  const y = { path: 0.06, street: 0.08, main: 0.1 };
  for (const k of Object.keys(byKind)) if (byKind[k].length) {
    const m = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(byKind[k]), new THREE.MeshLambertMaterial({ color: colors[k] }));
    m.position.y = y[k]; m.receiveShadow = true; scene.add(m);
  }
  // centre lines on streets and mains
  const lines = [];
  for (const r of block.roads) if (r.kind !== 'path') lines.push(ribbon(r.p, 0.35));
  if (lines.length) { const m = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(lines), new THREE.MeshBasicMaterial({ color: 0xe8e4d6 })); m.position.y = 0.12; scene.add(m); }
}

// ---------- high-detail zone (around Schaatsbaan 43) ----------
const detail = buildDetail({ scene, renderer, block, baseUrl: blockUrl });

// ---------- buildings ----------
const palette = {
  house: [0xe9a97a, 0xd98c62, 0xf0c39a, 0xc97b57, 0xe6b48f],
  apartments: [0xd8c9b2, 0xbfae95],
  retail: [0xf2d26a, 0xe8b84d], commercial: [0xf2d26a],
  garage: [0xb8bdc1], garages: [0xb8bdc1], shed: [0xa9b0a3],
  church: [0xd0d6dc], construction: [0xd7cfc4], school: [0xc9d7a8],
  yes: [0xe3b48d, 0xd9c8b0, 0xcdb79a, 0xe7c7a1],
};
{
  const geos = [];
  const color = new THREE.Color();
  let i = 0;
  // Real 3D BAG shapes (LoD 2.2) where we have them, extruded OSM footprints otherwise.
  const roofSlanted = [0x8a4b3a, 0x6f5a52, 0x9c5a43, 0x5d5f66], roofFlat = [0x9aa0a6, 0x8d9297, 0xa8acaf];
  const a = new THREE.Vector3(), b_ = new THREE.Vector3(), c = new THREE.Vector3(), nrm = new THREE.Vector3();
  function bagGeometry(m, wall, roof) {
    const pos = [], col = [];
    const V = (k) => [m.v[3 * k], m.v[3 * k + 2], -m.v[3 * k + 1]];
    m.f.forEach((face, fi) => {
      const sem = m.s[fi];
      if (sem === 0 || face.length < 3) return;
      const pts = face.map(V);
      // Newell normal, then drop the dominant axis to triangulate in 2D
      nrm.set(0, 0, 0);
      for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; nrm.x += (p[1] - q[1]) * (p[2] + q[2]); nrm.y += (p[2] - q[2]) * (p[0] + q[0]); nrm.z += (p[0] - q[0]) * (p[1] + q[1]); }
      const ax = Math.abs(nrm.x), ay = Math.abs(nrm.y), az = Math.abs(nrm.z);
      const [u, w] = ax >= ay && ax >= az ? [1, 2] : ay >= az ? [2, 0] : [0, 1];
      const tris = THREE.ShapeUtils.triangulateShape(pts.map(p => new THREE.Vector2(p[u], p[w])), []);
      const cc = sem === 1 ? roof : wall;
      for (const t of tris) {
        // keep each triangle wound the same way as the face so it faces outward
        a.fromArray(pts[t[0]]); b_.fromArray(pts[t[1]]); c.fromArray(pts[t[2]]);
        const flip = c.sub(a).cross(b_.sub(a)).dot(nrm) > 0;
        for (const k of (flip ? [t[0], t[2], t[1]] : t)) { pos.push(...pts[k]); col.push(cc.r, cc.g, cc.b); }
      }
    });
    if (!pos.length) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    return g;
  }
  let bagCount = 0;
  for (const [bi, b] of block.buildings.entries()) {
    if (detail.handled.has(bi)) continue;
    const pal = palette[b.kind] || palette.yes;
    color.setHex(pal[i++ % pal.length]);
    if (b.m) {
      const roof = new THREE.Color(b.roof === 'slanted' ? roofSlanted[i % roofSlanted.length] : roofFlat[i % roofFlat.length]);
      const g = bagGeometry(b.m, color, roof);
      if (g) { geos.push(g); bagCount++; continue; }
    }
    let g;
    try {
      g = new THREE.ExtrudeGeometry(shapeFrom(b.p, b.holes), { depth: b.h, bevelEnabled: false });
    } catch { continue; }
    g.rotateX(-Math.PI / 2);
    const n = g.attributes.position.count, col = new Float32Array(n * 3);
    const pos = g.attributes.position;
    for (let v = 0; v < n; v++) {
      // roofs slightly darker, walls lit by normal in shader
      const top = pos.getY(v) >= b.h - 0.01;
      const f = top ? 0.78 : 1.0;
      col[v * 3] = color.r * f; col[v * 3 + 1] = color.g * f; col[v * 3 + 2] = color.b * f;
    }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.deleteAttribute('uv');
    geos.push(g);
  }
  window.bagCount = bagCount;
  const merged = BufferGeometryUtils.mergeGeometries(geos);
  const m = new THREE.Mesh(merged, new THREE.MeshLambertMaterial({ vertexColors: true }));
  m.castShadow = true; m.receiveShadow = true; scene.add(m);
}

// ---------- trees ----------
{
  const trunk = new THREE.CylinderGeometry(0.25, 0.3, 1.6, 6); trunk.translate(0, 0.8, 0);
  const crown = new THREE.ConeGeometry(1.8, 4.2, 7); crown.translate(0, 3.6, 0);
  const tm = new THREE.InstancedMesh(trunk, new THREE.MeshLambertMaterial({ color: 0x7a5a3a }), block.trees.length);
  const cm = new THREE.InstancedMesh(crown, new THREE.MeshLambertMaterial({ color: 0x4f9a4a }), block.trees.length);
  const o = new THREE.Object3D();
  block.trees.forEach((t, k) => { if (detail.inZone(t[0], t[1])) { o.position.set(0, -100, 0); o.updateMatrix(); tm.setMatrixAt(k, o.matrix); cm.setMatrixAt(k, o.matrix); return; } o.position.set(t[0], 0, -t[1]); const s = 0.8 + Math.random() * 0.6; o.scale.set(s, s, s); o.updateMatrix(); tm.setMatrixAt(k, o.matrix); cm.setMatrixAt(k, o.matrix); });
  cm.castShadow = true; scene.add(tm, cm);
}


// ---------- house number plates ----------
// One instanced quad per numbered building, placed on the footprint edge closest to a road, 2 m up, facing outward.
{
  const roadPts = [];
  for (const r of block.roads) for (const q of r.p) roadPts.push(q);
  const cell = 30, rg = new Map();
  for (const q of roadPts) { const k = (Math.floor(q[0] / cell)) + ',' + (Math.floor(q[1] / cell)); (rg.get(k) || rg.set(k, []).get(k)).push(q); }
  function nearRoadDist(x, y) {
    let best = 1e9; const gx = Math.floor(x / cell), gy = Math.floor(y / cell);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (const q of (rg.get((gx + a) + ',' + (gy + b)) || [])) { const d = (q[0] - x) ** 2 + (q[1] - y) ** 2; if (d < best) best = d; }
    return best;
  }
  // texture atlas of digits/letters
  const chars = '0123456789abcdefghijklmnopqrstuvwxyz-/ ';
  const atlas = document.createElement('canvas'); atlas.width = 64 * chars.length; atlas.height = 96;
  const ax = atlas.getContext('2d'); ax.fillStyle = '#1d2b3a'; ax.fillRect(0, 0, atlas.width, atlas.height);
  ax.fillStyle = '#ffffff'; ax.font = 'bold 72px system-ui, sans-serif'; ax.textAlign = 'center'; ax.textBaseline = 'middle';
  for (let i = 0; i < chars.length; i++) ax.fillText(chars[i], i * 64 + 32, 50);
  const atex = new THREE.CanvasTexture(atlas); atex.colorSpace = THREE.SRGBColorSpace;
  const plateGeos = [];
  const tmp = new THREE.Object3D();
  for (const b of block.buildings) {
    if (!b.nums || !b.nums.length) continue;
    const text = b.nums.length > 2 ? b.nums[0] + '-' + b.nums[b.nums.length - 1] : b.nums.join('/');
    const low = text.toLowerCase();
    // best edge: midpoint nearest a road
    let bi = 0, bd = 1e9; const P_ = b.p;
    for (let i = 0; i < P_.length - 1; i++) { const mx = (P_[i][0] + P_[i + 1][0]) / 2, my = (P_[i][1] + P_[i + 1][1]) / 2; const d = nearRoadDist(mx, my); if (d < bd) { bd = d; bi = i; } }
    if (bd > 40 * 40) continue;
    const a = P_[bi], c = P_[bi + 1];
    const mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
    const ex = c[0] - a[0], ey = c[1] - a[1], el = Math.hypot(ex, ey) || 1;
    // outward normal: away from centroid
    let cx = 0, cy = 0; for (const q of P_) { cx += q[0]; cy += q[1]; } cx /= P_.length; cy /= P_.length;
    let nx = -ey / el, ny = ex / el; if ((mx - cx) * nx + (my - cy) * ny < 0) { nx = -nx; ny = -ny; }
    const w = 0.42 * low.length + 0.3, h = 0.6;
    const g = new THREE.PlaneGeometry(w, h, low.length, 1);
    // remap uvs per character cell
    const uv = g.attributes.uv; const pos = g.attributes.position;
    for (let v = 0; v < uv.count; v++) {
      const u = uv.getX(v); const col = Math.min(Math.floor(u * low.length + 1e-6), low.length - 1); const ci = Math.max(chars.indexOf(low[col]), 0);
      const local = u * low.length - col;
      uv.setX(v, (ci + (Math.abs(local) < 1e-6 ? 0 : (local > 0.999 ? 1 : local))) / chars.length);
    }
    // fix shared verts: PlaneGeometry shares vertices between segments, so rebuild non-indexed
    const ng = g.toNonIndexed(); const nuv = ng.attributes.uv; const npos = ng.attributes.position;
    for (let t = 0; t < nuv.count; t += 6) {
      const xs = [npos.getX(t), npos.getX(t + 1), npos.getX(t + 2), npos.getX(t + 3), npos.getX(t + 4), npos.getX(t + 5)];
      const minx = Math.min(...xs); const col = Math.round((minx + w / 2) / (w / low.length)); const ci = Math.max(chars.indexOf(low[Math.min(col, low.length - 1)]), 0);
      for (let k = 0; k < 6; k++) { const isRight = npos.getX(t + k) > minx + 1e-6; nuv.setX(t + k, (ci + (isRight ? 1 : 0)) / chars.length); }
    }
    tmp.position.set(mx + nx * 0.08, 2.1, -(my + ny * 0.08));
    tmp.rotation.y = Math.atan2(nx, -ny);
    tmp.updateMatrix(); ng.applyMatrix4(tmp.matrix);
    plateGeos.push(ng);
  }
  if (plateGeos.length) {
    const m = new THREE.Mesh(BufferGeometryUtils.mergeGeometries(plateGeos), new THREE.MeshBasicMaterial({ map: atex, side: THREE.DoubleSide }));
    scene.add(m);
  }
  window.__plates = plateGeos.length;
}

// ---------- shop signs ----------
function label(text, bg = '#fff8e6', fg = '#2b2b2b') {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  ctx.font = 'bold 40px system-ui, sans-serif';
  const w = Math.min(ctx.measureText(text).width + 40, 900);
  c.width = w; c.height = 72;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, w, 72, 18); ctx.fill();
  ctx.fillStyle = fg; ctx.font = 'bold 40px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 20, 38, w - 40);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: true }));
  sp.scale.set(w / 72 * 2.2, 2.2, 1); sp.userData.base = w / 72 * 2.2;
  return sp;
}
const pois = [];
for (const p of block.pois) {
  const sp = label(p.name, p.kind && /church|place_of_worship/.test(p.kind) ? '#e6ecff' : '#fff8e6');
  sp.position.set(p.x, 9.5, -p.y); scene.add(sp); pois.push({ ...p, sprite: sp });
}

// ---------- player ----------
const player = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 0.9, 4, 8), new THREE.MeshLambertMaterial({ color: 0x2f6fde }));
  body.position.y = 1.1; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), new THREE.MeshLambertMaterial({ color: 0xffd9b3 }));
  head.position.y = 2.15; head.castShadow = true;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.5, 10), new THREE.MeshLambertMaterial({ color: 0xe24a3b }));
  cap.position.y = 2.6;
  player.add(body, head, cap);
}
// start on the Schaatsbaan, falling back to the open road nearest the centre
let start = new THREE.Vector3(0, 0, 0);
{
  const START_STREET = 'Schaatsbaan';
  const sp = block.roads.filter(r => r.name === START_STREET).flatMap(r => r.p);
  if (block.start) {
    start = P([block.start.x, block.start.y]);
  } else if (sp.length) {
    sp.sort((a, b) => (a[0]*a[0]+a[1]*a[1]) - (b[0]*b[0]+b[1]*b[1]));
    start = P(sp[0]);
  } else {
    const cand = [];
    for (const r of block.roads) if (r.kind !== 'path') for (const p of r.p) cand.push(p);
    cand.sort((a, b) => (a[0]*a[0]+a[1]*a[1]) - (b[0]*b[0]+b[1]*b[1]));
    let bestScore = -1;
    for (const c of cand.slice(0, 150)) {
      let md = 1e9;
      for (const b of block.buildings) for (const q of b.p) { const d = (q[0]-c[0])**2 + (q[1]-c[1])**2; if (d < md) md = d; }
      if (md > bestScore) { bestScore = md; start = P(c); }
    }
  }
}
player.position.copy(start);
scene.add(player);

// ---------- camera control ----------
let fly = false;
const orbit = new OrbitControls(camera, renderer.domElement);

let yaw = Math.PI, pitch = 0.55, dist = 14;
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { if (!fly) { dragging = true; lx = e.clientX; ly = e.clientY; } });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => { if (!dragging || fly) return; yaw -= (e.clientX - lx) * 0.005; pitch = THREE.MathUtils.clamp(pitch + (e.clientY - ly) * 0.004, 0.15, 1.3); lx = e.clientX; ly = e.clientY; });
// zoom: from 5 m behind the player out to a 700 m bird's-eye view; the camera tilts down as it pulls back
const MIN_DIST = 5, MAX_DIST = 700;
function zoomBy(f) {

renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); if (!fly) zoomBy(Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))); }, { passive: false });
document.getElementById('zin').onclick = () => zoomBy(1 / 1.6);
document.getElementById('zout').onclick = () => zoomBy(1.6);
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === '-' || e.key === '_') zoomBy(1.6); if (e.key === '=' || e.key === '+') zoomBy(1 / 1.6); });

// ---------- click to go there ----------
// A click (not a drag) picks a point on the ground, a building or a sign; the player walks there.
// Far targets speed up so any trip takes a few seconds. Keys cancel the walk.
const ray = new THREE.Raycaster(); ray.camera = camera;
const mouse = new THREE.Vector2();
let goal = null, downAt = null;

renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5 || arriving) return;
  downAt = null;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(scene.children, true).find(h => h.object !== marker && !isPlayer(h.object) && (h.object.isMesh || h.object.isSprite));

  if (hit && hit.object.isSprite) {
    pt = hit.object.position.clone();
  } else if (hit) {
    pt = hit.point.clone();
    // clicked a wall or roof: stand on the ground a couple of metres out in front of it

      if (n.lengthSq() > 0.01) pt.add(n.normalize().multiplyScalar(2.5));

    // from the overview, drop in at the spot and look the way the camera was facing
    toggleFly();
    yaw = Math.atan2(camera.position.x - pt.x, camera.position.z - pt.z);
    player.position.copy(pt); goal = null; marker.visible = false;

});
function isPlayer(o) { for (let q = o; q; q = q.parent) if (q === player) return true; return false; }

// ---------- go to an address or named place ----------
// Matches "street number" against the baked addresses, then place names, then street names,
// and puts the player on the nearest road facing the building.
function findTarget(q) {
  const norm = t => (t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  const nq = norm(q); if (!nq) return null;
  const m = nq.match(/^(.*?)[ ,]+(\d+[a-z]?(?:[- ]?\w+)?)$/);
  const centroid = b => { let x = 0, y = 0; for (const p of b.p) { x += p[0]; y += p[1]; } return [x / b.p.length, y / b.p.length]; };
  if (m) {
    const b = block.buildings.find(b => b.nums && norm(b.street) === norm(m[1]) && b.nums.some(n => norm(n) === norm(m[2])));
    if (b) return { at: centroid(b), label: b.street + ' ' + m[2] };
  }
  const p = pois.find(p => norm(p.name) === nq) || pois.find(p => norm(p.name).includes(nq));
  if (p) return { at: [p.x, p.y], label: p.name };
  const r = block.roads.find(r => norm(r.name) === nq) || block.roads.find(r => r.name && norm(r.name).includes(nq));
  if (r) return { at: r.p[Math.floor(r.p.length / 2)], label: r.name, road: true };
  return null;
}
function goTo(q) {
  const t = findTarget(q);
  if (!t) { document.getElementById('place').textContent = 'not found: ' + q; return false; }
  let stand = t.at;
  if (!t.road) {
    let best = 1e18;
    for (const r of block.roads) if (r.kind !== 'path' || best > 1e17) for (let i = 0; i + 1 < r.p.length; i++) {
      const [ax, ay] = r.p[i], [bx, by] = r.p[i + 1], dx = bx - ax, dy = by - ay;
      const k = THREE.MathUtils.clamp(((t.at[0] - ax) * dx + (t.at[1] - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
      const px = ax + dx * k, py = ay + dy * k, d = (px - t.at[0]) ** 2 + (py - t.at[1]) ** 2;
      if (d < best) { best = d; stand = [px, py]; }
    }
  }
  if (fly) toggleFly();
  arriving = false; goal = null; marker.visible = false;
  player.position.set(stand[0], 0, -stand[1]);
  const dx = t.at[0] - stand[0], dz = -(t.at[1] - stand[1]);
  if (dx * dx + dz * dz > 0.01) { yaw = Math.atan2(-dx, -dz); player.rotation.y = Math.atan2(dx, dz); }
  dist = Math.min(dist, 22);
  document.getElementById('place').textContent = nearestPlace();
  return true;
}
document.getElementById('goto').addEventListener('submit', e => { e.preventDefault(); goTo(document.getElementById('q').value); document.getElementById('q').blur(); });

// ---------- collision: buildings, water, hedges and garden fences block walking ----------
const blocked = (() => {
  const polys = [...block.buildings.map(b => b.p), ...block.water.map(w => w.p), ...detail.solids];
  const cell = 25, grid = new Map(), bbs = [];
  polys.forEach((p, i) => {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of p) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    bbs.push([x0, y0, x1, y1]);
    for (let gx = Math.floor(x0 / cell); gx <= Math.floor(x1 / cell); gx++) for (let gy = Math.floor(y0 / cell); gy <= Math.floor(y1 / cell); gy++) { const k = gx + ',' + gy; (grid.get(k) || grid.set(k, []).get(k)).push(i); }
  });
  const inside = (x, y, p) => { let ok = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi) ok = !ok; } return ok; };
  const hit = (x, y) => { for (const i of grid.get(Math.floor(x / cell) + ',' + Math.floor(y / cell)) || []) { const b = bbs[i]; if (x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3] && inside(x, y, polys[i])) return true; } return false; };
  const R = 0.35;
  return (tx, tz) => { const x = tx, y = -tz; return hit(x, y) || hit(x + R, y) || hit(x - R, y) || hit(x, y + R) || hit(x, y - R); };
})();
let stuck = 0;

const keys = {};
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; keys[e.key.toLowerCase()] = true; if (e.key.toLowerCase() === 'f') toggleFly(); if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function toggleFly() {
  fly = !fly; orbit.enabled = fly;
  if (fly) { orbit.target.copy(player.position); }
  document.getElementById('place').textContent = fly ? 'free fly: drag to orbit, scroll to zoom, F to walk' : nearestPlace();
}

// ---------- arrival fly-in ----------
let t0 = performance.now(), arriving = true;
const camStart = new THREE.Vector3(start.x + 500, 900, start.z + 700);
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function camPitch() {
  const k = THREE.MathUtils.smoothstep(dist, 30, 300);
  return pitch + Math.max(0, 1.2 - pitch) * k;
}
function chaseCam() {
  const pe = camPitch();
  const off = new THREE.Vector3(Math.sin(yaw) * Math.cos(pe), Math.sin(pe), Math.cos(yaw) * Math.cos(pe)).multiplyScalar(dist);
  scene.fog.near = 350 + dist; scene.fog.far = 900 + dist * 2;
  const target = player.position.clone().add(off);
  camera.position.lerp(target, 0.15);
  camera.lookAt(player.position.x, player.position.y + 1.8, player.position.z);
}

function nearestPlace() {
  let best = 1e9, name = 'somewhere in Barendrecht';
  for (const p of pois) { const dx = p.x - player.position.x, dz = -p.y - player.position.z; const d = dx * dx + dz * dz; if (d < best) { best = d; name = p.name; } }
  let road = null, rb = 1e9;
  for (const r of block.roads) if (r.name) for (const p of r.p) { const dx = p[0] - player.position.x, dz = -p[1] - player.position.z; const d = dx * dx + dz * dz; if (d < rb) { rb = d; road = r.name; } }
  let ab = 1e9, addr = null;
  for (const b of block.buildings) if (b.nums) { let cx = 0, cy = 0; for (const q of b.p) { cx += q[0]; cy += q[1]; } cx /= b.p.length; cy /= b.p.length; const d = (cx - player.position.x) ** 2 + (-cy - player.position.z) ** 2; if (d < ab) { ab = d; addr = (b.street || road || '') + ' ' + b.nums[0]; } }
  return (ab < 30 * 30 && addr ? addr : (road ? road : '')) + (best < 60 * 60 ? '  ·  near ' + name : '');
}

document.getElementById('stats').textContent = `${block.buildings.length} buildings · ${block.roads.length} roads · ${block.pois.length} named places · ${block.trees.length} trees`;
document.getElementById('loading').remove();

let last = performance.now(), placeTimer = 0, signTick = -1;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  if (arriving) {
    const t = Math.min((now - t0) / 3200, 1);
    const k = easeOut(t);
    const off = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dist);
    const end = player.position.clone().add(off);
    camera.position.lerpVectors(camStart, end, k);
    camera.lookAt(player.position.x, player.position.y + 1.8 + (1 - k) * 40, player.position.z);
    if (t >= 1) { arriving = false; document.getElementById('place').textContent = nearestPlace(); }
  } else if (fly) {
    orbit.update();
  } else {
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const right = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const v = new THREE.Vector3();
    if (keys['w'] || keys['arrowup']) v.add(fwd);
    if (keys['s'] || keys['arrowdown']) v.sub(fwd);
    if (keys['a'] || keys['arrowleft']) v.sub(right);
    if (keys['d'] || keys['arrowright']) v.add(right);
    if (v.lengthSq() > 0) goal = null, marker.visible = false;
    let speed = keys['shift'] ? 14 : 5;
    if (goal) {
      const to = goal.clone().sub(player.position); to.y = 0;
      const d = to.length();
      if (d < 0.4) { goal = null; marker.visible = false; document.getElementById('place').textContent = nearestPlace(); }
      else { v.copy(to); speed = Math.max(speed, d / 2.5); speed = Math.min(speed * dt, d) / dt; }
    }
    if (goal) marker.material.opacity = 0.5 + 0.4 * Math.sin(now / 150);
    if (v.lengthSq() > 0) {
      v.normalize().multiplyScalar(speed * dt);
      // slide along walls: try the full step, then each axis on its own
      const p0 = player.position, startedInside = blocked(p0.x, p0.z);
      if (!startedInside && blocked(p0.x + v.x, p0.z + v.z)) {
        if (!blocked(p0.x + v.x, p0.z)) v.z = 0; else if (!blocked(p0.x, p0.z + v.z)) v.x = 0; else v.set(0, 0, 0);
      }
      if (goal && v.lengthSq() < 1e-6) { if ((stuck += dt) > 0.6) { goal = null; marker.visible = false; stuck = 0; } } else stuck = 0;
      player.position.add(v);
      player.position.x = THREE.MathUtils.clamp(player.position.x, -HALF, HALF);
      player.position.z = THREE.MathUtils.clamp(player.position.z, -HALF, HALF);
      player.rotation.y = Math.atan2(v.x, v.z);
      placeTimer += dt;
      if (placeTimer > 0.4) { placeTimer = 0; document.getElementById('place').textContent = nearestPlace(); }
    }
    chaseCam();
  }
  // signs: only the nearest few, so busy shopping streets stay readable
  if ((signTick = (signTick + 1) % 10) === 0) {
    for (const p of pois) p.d = camera.position.distanceTo(p.sprite.position);
    const near = new Set([...pois].sort((a, b) => a.d - b.d).slice(0, 12));
    for (const p of pois) { const k = THREE.MathUtils.clamp(p.d / 40, 0.6, 4); p.sprite.scale.set(p.sprite.userData.base * k, 2.2 * k, 1); p.sprite.visible = near.has(p) && p.d < 260 + (fly ? 0 : dist); }
  }
  // sharp shadows near the player, one wide shadow map for the overview
  {
    const close = !fly && !arriving && dist < 150, R = close ? 45 + dist * 0.8 : HALF;
    const c = close ? player.position : SUN_CENTRE;
    sun.target.position.copy(c); sun.position.copy(c).add(SUN_OFFSET);
    if (sc.right !== R) { sc.left = -R; sc.right = R; sc.top = R; sc.bottom = -R; sc.updateProjectionMatrix(); }
  }

  requestAnimationFrame(frame);
}
window.__toy = { scene, camera, player, toggleFly, orbit, get fly() { return fly; }, skip() { arriving = false; document.getElementById('place').textContent = nearestPlace(); } };
if (new URLSearchParams(location.search).get('view') === 'top') {
  arriving = false; toggleFly();
  camera.position.set(start.x + 120, 420, start.z + 320); orbit.target.copy(start);
  document.getElementById('place').textContent = 'overview';
}
{ const a = params.get('go') || (block.start && block.start.label.split(',')[0]); if (a) goTo(a); }
// ---------- time of day ----------
const TOD = {
  morning: { el: 14, az: 100, sun: 0xffe2c0, si: 1.4, hemi: 1.1, amb: 0.3, env: 0.4, exp: 0.8, fog: 0xc7d6e2, night: 0 },
  noon:    { el: 50, az: 200, sun: 0xfff2d8, si: 1.6, hemi: 1.4, amb: 0.35, env: 0.45, exp: 0.85, fog: 0x9ccbe8, night: 0 },
  golden:  { el: 7, az: 255, sun: 0xffb46a, si: 1.5, hemi: 0.8, amb: 0.22, env: 0.3, exp: 0.85, fog: 0xe8c6a0, night: 0.15 },
  dusk:    { el: -2, az: 280, sun: 0xff8a5a, si: 0.35, hemi: 0.45, amb: 0.15, env: 0.15, exp: 0.9, fog: 0x5a5f7a, night: 0.75 },
  night:   { el: -12, az: 300, sun: 0x8aa0ff, si: 0.18, hemi: 0.25, amb: 0.12, env: 0.06, exp: 1.0, fog: 0x10162a, night: 1 },
};
function applyTime(name) {
  const t = TOD[name] || TOD.noon, el = THREE.MathUtils.degToRad(Math.max(t.el, 4)), az = THREE.MathUtils.degToRad(t.az);
  SUN_OFFSET.set(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(480);
  sun.color.setHex(t.sun); sun.intensity = t.si; hemi.intensity = t.hemi; amb.intensity = t.amb;
  scene.environmentIntensity = t.env; renderer.toneMappingExposure = t.exp;
  scene.fog.color.setHex(t.fog);
  const tel = THREE.MathUtils.degToRad(t.el);
  sky.material.uniforms.sunPosition.value.set(Math.sin(az) * Math.cos(tel), Math.sin(tel), Math.cos(az) * Math.cos(tel));
  sky.visible = t.el > -6;

document.getElementById('tod').onchange = e => applyTime(e.target.value);
applyTime(params.get('time') || 'noon');
if (params.get('time')) document.getElementById('tod').value = params.get('time');

// ---------- OpenStreetMap minimap ----------
// Shows the real map around you with your position and heading; click it to walk there.
const toLatLon = (x, y) => [block.center.lat + y / 111320, block.center.lon + x / (111320 * Math.cos(block.center.lat * Math.PI / 180))];
const toLocal = (lat, lon) => [(lon - block.center.lon) * 111320 * Math.cos(block.center.lat * Math.PI / 180), (lat - block.center.lat) * 111320];
let mini = null, meMarker = null, followMini = true;
if (window.L) {
  mini = L.map('mini', { zoomControl: false, attributionControl: true }).setView(toLatLon(player.position.x, -player.position.z), 17);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(mini);
  mini.attributionControl.setPrefix(false);
  L.rectangle([toLatLon(-HALF, -HALF), toLatLon(HALF, HALF)], { color: '#2f6fde', weight: 1, fill: false, dashArray: '4' }).addTo(mini);
  meMarker = L.marker(toLatLon(player.position.x, -player.position.z), { icon: L.divIcon({ className: '', html: '<div class="me-arrow"></div>', iconSize: [14, 18], iconAnchor: [7, 9] }) }).addTo(mini);
  mini.on('dragstart', () => { followMini = false; setTimeout(() => followMini = true, 6000); });
  mini.on('click', e => {
    const [x, y] = toLocal(e.latlng.lat, e.latlng.lng);
    if (Math.abs(x) > HALF || Math.abs(y) > HALF) return;
    if (fly) toggleFly();
    arriving = false; goal = new THREE.Vector3(x, 0, -y); marker.position.set(x, 0.2, -y); marker.visible = true;
  });
  document.getElementById('minibtn').onclick = () => { document.getElementById('mini').classList.toggle('big'); setTimeout(() => mini.invalidateSize(), 250); };
  setInterval(() => {
    const ll = toLatLon(player.position.x, -player.position.z);
    meMarker.setLatLng(ll);
    const el = meMarker.getElement(); if (el) el.firstChild.style.transform = `rotate(${(-yaw * 180 / Math.PI).toFixed(0)}deg)`;
    if (followMini) mini.panTo(ll, { animate: false });
  }, 150);
} else document.getElementById('mini').style.display = document.getElementById('minibtn').style.display = 'none';

requestAnimationFrame(frame);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
