<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Toy City · Walk the streets you once knew</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Real Dutch towns, rebuilt from open map data, to walk through in your browser with friends." />
<script>
  // old links (meeting links, ?region=) pointed at the game itself: send them on with everything intact
  if (/[?&](meet|place|region)=/.test(location.search)) location.replace('city.html' + location.search + location.hash);
</script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; min-height: 100%; background: #9ccbe8; font-family: system-ui, sans-serif; color: #1b2a33; }
  main { max-width: 880px; margin: 0 auto; padding: 48px 20px 32px; }
  h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); letter-spacing: -.02em; }
  .lead { margin: 8px 0 32px; font-size: 17px; color: #31495a; }
  #places { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; padding: 0; margin: 0; list-style: none; }
  .place { display: block; overflow: hidden; border-radius: 16px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 2px 10px rgba(0,0,0,.12); transition: transform .15s, box-shadow .15s; }
  .place:hover, .place:focus-visible { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.18); outline: none; }
  .place img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: #c9dbe6; }
  .place div { padding: 14px 16px 16px; }
  .place h2 { margin: 0 0 4px; font-size: 20px; }
  .place p { margin: 0; font-size: 14px; line-height: 1.45; color: #4a5a66; }
  .place .go { display: inline-block; margin-top: 10px; font-weight: 600; color: #2f6fde; }
  footer { margin-top: 36px; font-size: 13px; color: #31495a; line-height: 1.6; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>🏘️ Toy City</h1>
  <p class="lead">Walk the streets you once knew. Pick a place.</p>
  <ul id="places" aria-label="Places"></ul>
  <footer>
    Every house, hedge and canal comes from open map data. Other players appear as you meet them; tap someone to talk.<br/>
    Map data © PDOK / Kadaster, 3D BAG (TU Delft) and © OpenStreetMap contributors.
  </footer>
</main>
<script>
  // the places are listed in places.json; adding a place is one entry there (and its region baked)
  fetch('places.json').then(r => r.json()).then(places => {
    const ul = document.getElementById('places');
    for (const p of places) {
      const li = document.createElement('li'), a = document.createElement('a');
      a.className = 'place'; a.href = 'city.html?place=' + encodeURIComponent(p.id);
      const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; if (p.photo) img.src = p.photo;
      const d = document.createElement('div'), h = document.createElement('h2'), t = document.createElement('p'), go = document.createElement('span');
      h.textContent = p.name; t.textContent = p.about || ''; go.className = 'go'; go.textContent = 'Walk here →';
      d.append(h, t, go); a.append(img, d); li.append(a); ul.append(li);
    }
  }).catch(() => { document.getElementById('places').innerHTML = '<li><a class="place" href="city.html"><div><h2>Start walking</h2></div></a></li>'; });
</script>
</body>
</html>
