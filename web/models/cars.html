<!doctype html><html><body style="margin:0"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// preview of models/cars.glb: near versions in front, far versions behind, each painted a city colour
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setClearColor(0x9fb8cc);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.9;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xdff0ff,0x8a9a7a,1.4),new THREE.AmbientLight(0xffffff,0.35));
const d=new THREE.DirectionalLight(0xfff2d8,2);d.position.set(-4,8,6);s.add(d);
s.add(new THREE.Mesh(new THREE.PlaneGeometry(60,60).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x6a6e72})));
const c=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);c.position.set(4,9,26);c.lookAt(0,0.5,0);
const paints=[0x8c1c1c,0xf2f2f2,0x24365c,0x8a8f96,0x1c1c1e];
const g=await new GLTFLoader().loadAsync('cars.glb');
const names=['golf','camry','fiat500','jeep','van'];
names.forEach((n,i)=>{for(const [suf,z] of [['',3.5],['_lo',-3.5]]){const o=g.scene.getObjectByName(n+suf);if(!o)continue;const k=o.clone(true);
 k.traverse(m=>{if(m.isMesh){m.material=m.material.clone();if(m.material.name.startsWith('paint'))m.material.color.setHex(paints[i]);}});
 k.position.set((i-2)*5.4,0,z);k.rotation.y=Math.PI*0.08;s.add(k);}});
r.render(s,c);window.done=1;
</script></body></html>
