<!doctype html><html><body style="margin:0"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// preview of models/person.glb under city-like lighting: front, side and back, mid-stride
import * as THREE from 'three';import {loadAvatar} from '../avatar.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);r.setClearColor(0x9fb8cc);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.85;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.add(new THREE.HemisphereLight(0xdff0ff,0x8a9a7a,1.4),new THREE.AmbientLight(0xffffff,0.35));
const d=new THREE.DirectionalLight(0xfff2d8,1.6);d.position.set(-2,4,3);s.add(d);
const g=new THREE.Mesh(new THREE.PlaneGeometry(20,20).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0xb9b6ae}));s.add(g);
const c=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,50);c.position.set(0,1.0,7.5);c.lookAt(0,0.9,0);
const clip=new URLSearchParams(location.search).get('c')||'walk';
for(const [x,ry] of [[-1.3,0],[0,Math.PI/2],[1.3,Math.PI]]){const {model,clips}=await loadAvatar(new URL('../',location.href));model.position.x=x;model.rotation.y=ry;s.add(model);
const mx=new THREE.AnimationMixer(model);mx.clipAction(clips[clip]).play();mx.update(0.3);}
r.render(s,c);window.done=1;
</script></body></html>
