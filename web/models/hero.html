<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#9ccbe8"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// README pictures: ?shot=cars (the five parked cars) or ?shot=crew (the person meeting a car).
// Renders one frame and posts it to the dev server's /_snap.
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const shot=new URLSearchParams(location.search).get('shot')||'cars';
const W=1600,H=shot==='cars'?700:900;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=0.95;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xbfe0f5);s.fog=new THREE.Fog(0xbfe0f5,40,90);
s.add(new THREE.HemisphereLight(0xe8f4ff,0x7d8b6a,1.3));
const sun=new THREE.DirectionalLight(0xfff0d6,2.6);sun.position.set(-10,16,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});s.add(sun);
// a little Dutch street: grey road, white dashes, red cycle lane, pavement, grass
const plane=(w,d,c,y,z)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:c}));m.position.set(0,y,z);m.receiveShadow=true;s.add(m);};
plane(200,200,0x7fb85a,-0.01,0);plane(200,7,0x5f6670,0,0);plane(200,2.2,0xb5523f,0.005,-4.6);plane(200,2.6,0xc9cdd1,0.01,5.2);
for(let x=-60;x<60;x+=6){const m=new THREE.Mesh(new THREE.PlaneGeometry(3,0.15).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(x,0.02,0);s.add(m);}
const g=await new GLTFLoader().loadAsync('cars.glb');
const paints={golf:0x8c1c1c,camry:0xd8dadc,fiat500:0x2f6fd0,jeep:0x2f6fd0,van:0xf2f2f2};
const place=(n,x,z,ry)=>{const o=g.scene.getObjectByName(n).clone(true);o.traverse(m=>{if(m.isMesh){m.castShadow=m.receiveShadow=true;m.material=m.material.clone();if(m.material.name.startsWith('paint'))m.material.color.setHex(paints[n]);}});o.position.set(x,0,z);o.rotation.y=ry;s.add(o);return o;};
const c=new THREE.PerspectiveCamera(shot==='cars'?44:35,W/H,0.1,300);
if(shot==='cars'){['golf','camry','fiat500','jeep','van'].forEach((n,i)=>place(n,(i-2)*5.6,2.2,0));c.position.set(3,3.6,19);c.lookAt(1.3,0.8,1.8);}
else{
  place('fiat500',-1.2,2.2,0);place('golf',-7.5,2.2,0);place('van',6.5,2.2,0);
  const p=await new GLTFLoader().loadAsync('person.glb');const m=p.scene;m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;}});
  m.position.set(1.4,0,4.6);m.rotation.y=0.55;s.add(m);
  const mix=new THREE.AnimationMixer(m);const clip=p.animations.find(a=>/wave|idle|agree/i.test(a.name))||p.animations[0];if(clip){mix.clipAction(clip).play();mix.update(0.6);}
  // a speech bubble, because everyone in Barendrecht says hoi
  const cv=document.createElement('canvas');cv.width=512;cv.height=200;const x=cv.getContext('2d');x.fillStyle='#fff';x.beginPath();x.roundRect(10,10,492,150,40);x.fill();x.beginPath();x.moveTo(200,158);x.lineTo(240,158);x.lineTo(190,195);x.fill();
  x.fillStyle='#1b2a33';x.font='bold 64px system-ui,sans-serif';x.textAlign='center';x.fillText('Hoi!',256,110);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:Object.assign(new THREE.CanvasTexture(cv),{colorSpace:THREE.SRGBColorSpace}),toneMapped:false,fog:false}));sp.scale.set(2.6,1.02,1);sp.position.set(2.3,2.75,4.6);s.add(sp);
  c.position.set(7,3.2,13);c.lookAt(0.5,1.1,3.2);
}
r.render(s,c);
r.domElement.toBlob(b=>fetch('/_snap',{method:'POST',body:b}).then(()=>window.done=1));
</script></body></html>
